server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Debe ser >= MAX_UPLOAD_MB del backend
  client_max_body_size 10m;

  # DNS interno de Docker. Al usar una variable en proxy_pass, Nginx vuelve a resolver
  # "backend" cada 10 s: si el contenedor del backend se recrea y cambia de IP,
  # la API sigue funcionando sin reiniciar el frontend.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  # Las llamadas a la API se reenvían al contenedor del backend
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router: cualquier ruta desconocida devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
